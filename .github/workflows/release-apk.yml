name: Release APK

# Builds the app (with our glass mini player) and publishes an installable APK
# as a GitHub Release -- the same distribution idea as echo-apk-mirror, but for
# our own build instead of a pass-through of the official nightly.

on:
  push:
    branches: [ main ]
  workflow_dispatch: { }

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare artifact + checksum
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk echo-glass.apk
          sha256sum echo-glass.apk | tee echo-glass.apk.sha256

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: glass-build-${{ github.run_number }}
          name: "Echo + glass mini player (build ${{ github.run_number }})"
          body: |
            Automated debug build of Echo with the glass (frosted) mini player.

            Install:
            1. Uninstall the official Echo first -- this build is signed with the
               Android debug key, so it cannot install over the official one.
            2. Install `echo-glass.apk`.

            Verify the download:
            `sha256sum -c echo-glass.apk.sha256`
          files: |
            echo-glass.apk
            echo-glass.apk.sha256
